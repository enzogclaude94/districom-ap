# W2-B compatibility checks. They run with the backend's own environment:
#   uv run --project ../../../backend pytest            (from this folder)
[pytest]
testpaths = checks
pythonpath = ../../../backend .
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    criterion(id): W2-B acceptance criterion (B-1 ... B-10) that the test provides evidence for
