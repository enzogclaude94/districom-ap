[project]
name = "districom-backup"
version = "0.1.0"
description = "W2-A proof of concept: physical backups, WAL archiving, PITR and restore for DistriCom on Windows (ADR 016, proposed)"
requires-python = ">=3.12"
# Standard library only: the archive and restore commands run from PostgreSQL itself.
dependencies = []

[project.scripts]
districom-backup = "districom_backup.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/districom_backup"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
# S101: assert in tests. S603/S607: the package runs PostgreSQL and rclone binaries by design, never through a shell.
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"tests/conftest.py" = ["E501"]  # long Spanish descriptions of the criteria, printed in the report

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "criterion(id): W2-A acceptance criterion (A-1 ... A-19) that the test provides evidence for",
    "integration: needs PostgreSQL binaries (DISTRICOM_PG_BIN)",
]
