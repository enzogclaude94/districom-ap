# pgBackRest for DistriCom (ADR 013, docs/OPERATIONS.md).
# Only structure lives here. Secrets (cipher passphrases, S3 keys) and the whole off-site repository (repo2)
# come from PGBACKREST_* variables in deploy/pgbackrest.env, which never enters Git.

[global]
# repo1: the backup disk of the server, mounted at /var/lib/pgbackrest.
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# Two weekly fulls with their differentials and every WAL in between: point-in-time restore for ~2 weeks.
repo1-retention-full=2

# WAL is pushed in the background so a slow or absent Internet link never delays a commit.
archive-async=y
spool-path=/var/spool/pgbackrest
# If the off-site repository stays unreachable, stop queueing WAL beyond this size instead of filling the disk
# (PostgreSQL keeps working; the monitor reports the gap; a new full backup closes it).
archive-push-queue-max=8GiB

compress-type=zst
process-max=2
start-fast=y
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

[districom]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
