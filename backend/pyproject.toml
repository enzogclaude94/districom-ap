[project]
name = "districom-backend"
version = "0.1.0"
description = "DistriCom modular platform API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL"]

# Module boundaries (ARCHITECTURE.md §4.2). Run with `uv run lint-imports`.
[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layers: api -> modules -> platform -> db -> core"
type = "layers"
layers = ["app.api", "app.modules", "app.platform", "app.db", "app.core"]
# db/models.py imports every model only to register it on Base.metadata for Alembic.
ignore_imports = ["app.db.models -> app.platform.**"]  # add app.modules.** when a module has models

[[tool.importlinter.contracts]]
name = "Modules do not import each other (only a declared public.py, none today)"
type = "independence"
modules = ["app.modules.*"]
