[project]
name = "districom-backend"
version = "0.1.0"
description = "DistriCom modular platform API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.2",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20261017",
    "xlwt>=1.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]
"perf/**" = ["S311"]  # the dataset generator wants reproducible pseudo-random numbers, never secrets

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL"]

# Module boundaries (ARCHITECTURE.md §4.2). Run with `uv run lint-imports`.
[tool.importlinter]
root_package = "app"
# External packages are part of the graph so a contract can forbid libraries (the import readers below).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api -> modules -> platform -> db -> core"
type = "layers"
layers = ["app.api", "app.modules", "app.platform", "app.db", "app.core"]
# db/models.py imports every model only to register it on Base.metadata for Alembic.
ignore_imports = ["app.db.models -> app.platform.**", "app.db.models -> app.modules.**"]

[[tool.importlinter.contracts]]
name = "Modules do not import each other (only a declared public.py, none today)"
type = "independence"
modules = ["app.modules.*"]

[[tool.importlinter.contracts]]
name = "Only the import readers use the file libraries (ADR 014 §2.3: adapters never import xlrd, openpyxl or csv)"
type = "forbidden"
source_modules = ["app.modules.commercial", "app.platform"]
forbidden_modules = ["xlrd", "openpyxl", "csv"]
ignore_imports = [
    "app.platform.imports.readers.xls -> xlrd",
    "app.platform.imports.readers.xlsx -> openpyxl",
    "app.platform.imports.readers.text -> csv",
]
